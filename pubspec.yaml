name: pixelorbit
description: Pixel Orbit — 16-bit space shooter (Flutter v1)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon-512.png
  adaptive_icon_background: "#050818"
  adaptive_icon_foreground: assets/icon-512.png

flutter:
  uses-material-design: true
  assets:
    - assets/
