name: pixelorbit
description: Pixel Orbit — 16-bit space shooter
publish_to: "none"
version: 2.1.0+21

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.3
  supabase_flutter: 2.8.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon-512.png
  adaptive_icon_background: "#050818"
  adaptive_icon_foreground: assets/icon-512.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon-512.png
    - assets/icon-192.png
    - assets/icon.png

dependency_overrides:
  # Keep app_links from using broken flutter.compileSdkVersion path on CI
  app_links: 6.3.3
