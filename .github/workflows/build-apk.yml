name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Prepare Android
        run: |
          set -e
          flutter create --project-name pixelorbit --org com.azena /tmp/po_scaffold
          rm -rf android
          cp -a /tmp/po_scaffold/android ./android
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/applicationId [= ]*".*"/applicationId = "com.azena.pixelorbit"/g' "$f" || true
            sed -i 's/applicationId ".*"/applicationId "com.azena.pixelorbit"/g' "$f" || true
            sed -i 's/namespace [= ]*".*"/namespace = "com.azena.pixelorbit"/g' "$f" || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' "$f" || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' "$f" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' "$f" || true
          done

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pixelorbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
