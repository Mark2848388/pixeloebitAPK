name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Prepare Android (stable applicationId)
        run: |
          set -e
          flutter create --project-name pixelorbit --org com.azena /tmp/pixelorbit_scaffold
          rm -rf android
          cp -a /tmp/pixelorbit_scaffold/android android

          # Force same id so APK updates over previous install
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/applicationId [= ]*".*"/applicationId = "com.azena.pixelorbit"/g' "$f" || true
            sed -i 's/applicationId ".*"/applicationId "com.azena.pixelorbit"/g' "$f" || true
            sed -i 's/namespace [= ]*".*"/namespace = "com.azena.pixelorbit"/g' "$f" || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' "$f" || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' "$f" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/g' "$f" || true
          done

          # Gradle 8.9 if needed
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$WRAPPER" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip|' "$WRAPPER" || true
          fi
          if [ -f android/settings.gradle ]; then
            sed -i 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle || true
            sed -i "s/id 'org.jetbrains.kotlin.android' version '.*'/id 'org.jetbrains.kotlin.android' version '2.0.21'/g" android/settings.gradle || true
          fi

          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          # gallery for profile photo
          if [ -f "$MANIFEST" ] && ! grep -q 'READ_MEDIA_IMAGES' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          fi

          # Show version from pubspec for debug
          grep '^version:' pubspec.yaml

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
        continue-on-error: true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pixelorbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
