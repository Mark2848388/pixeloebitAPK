name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify sources
        run: |
          test -f lib/main.dart
          test -f lib/game.dart
          test -f lib/online.dart
          test -f assets/icon-512.png
          if grep -q "Flutter Demo Home Page" lib/main.dart; then
            echo "::error::Wrong main.dart (demo template)"
            exit 1
          fi
          echo "OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Android scaffold (keep lib/)
        run: |
          if [ ! -d android ]; then
            flutter create --project-name pixelorbit --org com.azena /tmp/po_scaffold
            cp -a /tmp/po_scaffold/android ./android
            if [ -f android/app/build.gradle ]; then
              sed -i 's/applicationId ".*"/applicationId "com.azena.pixelorbit"/' android/app/build.gradle || true
            fi
            if [ -f android/app/build.gradle.kts ]; then
              sed -i 's/applicationId = ".*"/applicationId = "com.azena.pixelorbit"/' android/app/build.gradle.kts || true
            fi
          fi

      - run: flutter pub get

      - name: Launcher icons from assets/icon-512.png
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pixelorbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
